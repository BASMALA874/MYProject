<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MY Project HTML & CSS Tutorial Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Lucida Sans', 'Lucida Sans Unicode', 'Lucida Grande', sans-serif;
      font-size: 18px;
      color: #333;
      text-align: center;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #cceeff, #b3e0ff, #e0f7ff);
      background-size: 400% 400%;
      animation: bgMove 10s infinite alternate;
    }

    @keyframes bgMove {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 100% 50%;
      }
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container {
      background-color: white;
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      max-width: 700px;
      animation: fadeInUp 1.5s ease-out;
    }

    h1 {
      font-size: 36px;
      color: #0077b6;
    }

    h2 {
      direction: rtl;
      text-align: right;
      color: #6c5b7b;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1); /* الظل */
    }

    p {
      direction: rtl;
      text-align: right;
      line-height: 1.6;
      color: #355c7d; 
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welcome to MY Digital Playground</h1>
    <h2>رسائل من نور.</h2>
    <p class="quote">
      الطمأنينة لا تأتي من الظروف، بل من اليقين بالله.<br>
      حين تثق أن الله يدبّر أمورك، يسكن قلبك السلام حتى وسط العواصف.<br>
      ﴿ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ﴾... فاذكر الله، واطمئن.
    </p>
  </div>

</body>
</html>
